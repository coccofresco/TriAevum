[package]
name = "forge-cli"
description = "TriAevum Forge command line and worker protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "triaevum-forge"
path = "src/main.rs"

[features]
# The MM3D Forge (installed game executable "Moonfall_Curse.exe").
title-mm3d = ["forge-core/title-mm3d"]

[dependencies]
forge-core = { path = "../forge-core" }
forge-native = { path = "../forge-native" }
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
forge-catalog = { path = "../forge-catalog" }
tempfile.workspace = true
