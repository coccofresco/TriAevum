[package]
name = "forge-core"
description = "TriAevum Forge preparation engine: ROM import, title data, assets and activation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["https"]
# The verified HD texture download of the install job (desktop).
https = ["forge-mods/https"]
# The MM3D Forge (installed game executable "Moonfall_Curse.exe").
title-mm3d = ["forge-catalog/title-mm3d", "forge-assets/title-mm3d"]

[dependencies]
forge-assets = { path = "../forge-assets" }
forge-base = { path = "../forge-base" }
forge-catalog = { path = "../forge-catalog" }
forge-mods = { path = "../forge-mods", default-features = false }
forge-native = { path = "../forge-native" }
forge-prepare = { path = "../forge-prepare" }
forge-rom = { path = "../forge-rom" }
# Publisher signatures (Ed25519) of update packages (desktop, UX plan WP-04B,
# owner decision 10) and of the Android Forge package (forge-android): the
# same ring the HTTPS client already links.
ring = "0.17"
serde_json.workspace = true
tempfile.workspace = true
# The support bundle (same version and features as forge-mods and forge-native).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }


[target.'cfg(windows)'.dependencies]
# The update helper: inherited process handle, kill-on-close job.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
