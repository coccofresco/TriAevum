[package]
name = "forge-base"
description = "TriAevum Forge foundations: errors, cancellation, hashing, legacy JSON, durable writes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# Restart Manager: names the programs holding a locked file (issue #110).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RestartManager"] }

[dev-dependencies]
tempfile.workspace = true
